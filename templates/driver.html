<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <title>C.A.R.E. Driver Terminal</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: white; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: #1e293b; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h1 { color: #38bdf8; text-align: center; }
        button { background: #ef4444; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 15px; }
    </style>
</head>
<body>
    <div class='container'>
        <h1>C.A.R.E. Driver Terminal</h1>
        <p>Submit your Daily Vehicle Inspection Report (DVIR) or signal an emergency breakdown.</p>
        <button onclick='alert("Emergency Breakdown Signal Sent to Cleveland Dispatch!")'>SIGNAL BREAKDOWN</button>
    </div>
</body>
</html>
