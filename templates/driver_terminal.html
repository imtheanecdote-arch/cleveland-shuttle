<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C.A.R.E. - Driver Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <span class="text-xl font-bold tracking-wide text-blue-400">C.A.R.E. Driver Terminal</span>
        </div>
        <div class="flex items-center space-x-4">
            <span class="text-sm text-slate-300">Logged in as: <strong class="text-white">{{ username }}</strong></span>
            <a href="/logout" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow">Sign Out</a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-6 space-y-6">
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-semibold mb-2">Welcome, {{ username }}!</h1>
                <p class="text-slate-400 text-sm">Manage your shift status and accept passenger dispatch requests below.</p>
            </div>
            <div class="flex space-x-3">
                <button onclick="setStatus('On Duty')" class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded-lg text-sm font-medium transition shadow">Go On Duty</button>
                <button onclick="setStatus('Offline')" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-sm font-medium transition shadow">Go Offline</button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl">
                <h2 class="text-lg font-medium mb-3 text-blue-400">Current Status</h2>
                <div class="flex items-center space-x-3">
                    <span id="status-indicator" class="h-3 w-3 bg-green-500 rounded-full animate-pulse"></span>
                    <span id="status-text" class="text-sm font-medium">On Duty / Ready for Dispatch</span>
                </div>
            </div>

            <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl">
                <h2 class="text-lg font-medium mb-3 text-blue-400">Active Ride Assignment</h2>
                <div id="assignment-box" class="space-y-3">
                    <div class="bg-slate-900 border border-slate-700 p-4 rounded-lg">
                        <p class="text-sm text-slate-300"><strong>Pickup:</strong> Student Union Building</p>
                        <p class="text-sm text-slate-300"><strong>Dropoff:</strong> Science & Tech Center</p>
                        <div class="mt-4 flex space-x-2">
                            <button class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded text-xs font-medium">Accept Ride</button>
                            <button class="bg-slate-700 hover:bg-slate-600 text-slate-300 px-3 py-1.5 rounded text-xs font-medium">Decline</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        function setStatus(status) {
            document.getElementById('status-text').innerText = status;
            const dot = document.getElementById('status-indicator');
            if(status === 'On Duty') {
                dot.className = "h-3 w-3 bg-green-500 rounded-full animate-pulse";
            } else {
                dot.className = "h-3 w-3 bg-slate-500 rounded-full";
            }
        }
    </script>
</body>
</html>
