<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>C.A.R.E. Login</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); width: 320px; }
        h2 { text-align: center; margin-bottom: 20px; color: #f8fafc; }
        .form-group { margin-bottom: 15px; position: relative; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #cbd5e1; }
        input { width: 100%; padding: 10px 35px 10px 12px; border: 1px solid #334155; background: #0f172a; color: #fff; border-radius: 6px; box-sizing: border-box; }
        input:focus { outline: none; border-color: #3b82f6; }
        .toggle-password { position: absolute; right: 12px; top: 34px; cursor: pointer; color: #94a3b8; font-size: 16px; user-select: none; }
        button { width: 100%; padding: 10px; background: #2563eb; border: none; color: white; font-weight: bold; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #1d4ed8; }
        .error { color: #ef4444; font-size: 13px; text-align: center; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>C.A.R.E. Portal</h2>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST" action="/login">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" id="password" required autocomplete="current-password">
                <span class="toggle-password" onclick="togglePassword()">👁️</span>
            </div>
            <button type="submit">Sign In</button>
        </form>
    </div>
    <script>
        function togglePassword() {
            const pwdInput = document.getElementById('password');
            const toggleIcon = document.querySelector('.toggle-password');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                toggleIcon.textContent = '👁️‍🗨️';
            } else {
                pwdInput.type = 'password';
                toggleIcon.textContent = '👁️';
            }
        }
    </script>
</body>
</html>
